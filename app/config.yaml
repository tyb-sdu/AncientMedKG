# 中药烧伤古今文献 RAG 配置。所有路径均相对于仓库根目录。
project_name: "中药烧伤古今文献RAG"
project_root: ".."

paths:
  modern_pdf_dir: "corpus/modern_pdf"
  mapping_csv: "corpus/modern_metadata.csv"
  data_dir: "runtime/modern"
  logs_dir: "runtime/logs"
  state_dir: "runtime/state"
  ancient_data_dir: "runtime/ancient"
  ancient_database: "runtime/ancient/ancient_rag.db"
  ancient_books_jsonl: "runtime/ancient/books.jsonl"
  ancient_pages_jsonl: "runtime/ancient/pages.jsonl"
  ancient_layout_sidecar: "runtime/ancient/pages_layout_v2.jsonl"
  ancient_qwen_vector_dir: "runtime/ancient/vector_qwen3_8b_pages"
  ancient_qwen_faiss_index: "runtime/ancient/vector_qwen3_8b_pages/faiss.index"
  ancient_qwen_vector_manifest: "runtime/ancient/vector_qwen3_8b_pages/manifest.json"
  ancient_qwen_vector_map: "runtime/ancient/vector_qwen3_8b_pages/page_ids.jsonl"
  ancient_qwen_embeddings_checkpoint: "runtime/ancient/vector_qwen3_8b_pages/embeddings.npy"
  ancient_qwen_embedding_progress: "runtime/ancient/vector_qwen3_8b_pages/progress.json"
  documents_csv: "runtime/modern/documents.csv"
  documents_jsonl: "runtime/modern/documents.jsonl"
  pages_jsonl: "runtime/modern/pages.jsonl"
  chunks_jsonl: "runtime/modern/chunks.jsonl"
  quality_issues_csv: "runtime/modern/quality_issues.csv"
  database: "runtime/modern/rag.db"
  vector_dir: "runtime/modern/vector_e5"
  faiss_index: "runtime/modern/vector_e5/faiss.index"
  vector_manifest: "runtime/modern/vector_e5/manifest.json"
  vector_map: "runtime/modern/vector_e5/chunk_ids.jsonl"
  embeddings_checkpoint: "runtime/modern/vector_e5/embeddings.npy"
  embedding_progress: "runtime/modern/vector_e5/progress.json"
  embedding_model_dir: "models/multilingual-e5-small-onnx"
  bge_vector_dir: "runtime/modern/vector_bge_m3"
  bge_faiss_index: "runtime/modern/vector_bge_m3/faiss.index"
  bge_vector_manifest: "runtime/modern/vector_bge_m3/manifest.json"
  bge_vector_map: "runtime/modern/vector_bge_m3/chunk_ids.jsonl"
  bge_embeddings_checkpoint: "runtime/modern/vector_bge_m3/embeddings.npy"
  bge_embedding_progress: "runtime/modern/vector_bge_m3/progress.json"
  bge_embedding_model_dir: "models/BAAI/bge-m3"
  bge_reranker_model_dir: "models/BAAI/bge-reranker-v2-m3"
  qwen_vector_dir: "runtime/modern/vector_qwen3_8b"
  qwen_faiss_index: "runtime/modern/vector_qwen3_8b/faiss.index"
  qwen_vector_manifest: "runtime/modern/vector_qwen3_8b/manifest.json"
  qwen_vector_map: "runtime/modern/vector_qwen3_8b/chunk_ids.jsonl"
  qwen_embeddings_checkpoint: "runtime/modern/vector_qwen3_8b/embeddings.npy"
  qwen_embedding_progress: "runtime/modern/vector_qwen3_8b/progress.json"
  qwen_embedding_model_dir: "models/Qwen/Qwen3-Embedding-8B"
  qwen_reranker_model_dir: "models/Qwen/Qwen3-Reranker-8B"
  retrieval_eval: "runtime/modern/retrieval_eval.json"
  doi_audit: "runtime/modern/doi_audit.json"
  source_checksums_before: "runtime/modern/source_checksums_before.jsonl"
  source_checksums_after: "runtime/modern/source_checksums_after.jsonl"
  run_manifest: "runtime/modern/run_manifest.json"
  pipeline_log: "runtime/logs/pipeline.log"

extraction:
  preferred_engine: "pymupdf"  # pymupdf | pypdf | pdfplumber
  empty_page_char_threshold: 30
  needs_ocr_empty_page_ratio: 0.80
  short_doc_char_threshold: 200

chunking:
  en_target_words_min: 600
  en_target_words_max: 1000
  zh_target_chars_min: 800
  zh_target_chars_max: 1500
  overlap_ratio: 0.08
  min_chunk_chars: 80
  max_chunk_chars_hard: 8000

topics:
  low_relevance_threshold: 25
  allowed_tags:
    - burn
    - scald
    - wound_healing
    - Lonicera
    - honeysuckle
    - 忍冬
    - 金银花
    - Glycyrrhiza
    - licorice
    - 甘草
    - chlorogenic_acid
    - glycyrrhizin
    - inflammation
    - oxidative_stress
    - antimicrobial
    - hydrogel
    - drug_delivery
    - network_pharmacology
    - knowledge_graph
    - clinical_evidence
    - safety
    - off_topic

quality:
  high_empty_page_ratio: 0.50
  garbled_ratio_threshold: 0.15
  abnormal_page_count_max: 500
  short_chunk_chars: 50
  long_chunk_chars: 12000

runtime:
  encoding: "utf-8"
  progress_every: 10
  checksum_workers: 4

# 只在原文中得到明确 DOI 证据时修正；键为源文件 SHA-256。
doi_overrides:
  "2a55d48268e3341a4e622ada4d97dbcb1208e9bc4c4d017a333742a7dab244ad": "10.2147/DDDT.S296862"
  "6d5d9d51619e02be88e064958049fbd967d8d9ed0f90f13ec947b5b55eedd83f": "10.1371/journal.ppat.1009294"
  "d6a2b03a50e892c1ceb40b24abd54d6a996f52fc3aa342d1d68a3341dc0ef89f": "10.3390/antiox10010099"
  "2c3d957108edadf8600d29a8ddb2278177e693e0ee74f7bb7b61834ae796db1e": "10.3390/molecules26072001"
  "81016ae80769ccaa789d2406bcdc59ebd87711956214a6ca4b12d6ea9efbad77": "10.3390/antiox14050521"
  "58538c192a3442546154d7e6e1136063e2cc88e78fccdea8e3668246607591f4": "10.1016/j.xjidi.2026.100482"

# PDF 元数据题名明显异常时，仅按源文件 SHA-256 使用首页可核验题名。
title_overrides:
  "eecf4a690d1d17b536144cd5d7ac17cf3cf0c2dd80a94071279b2879edc86349": "Anti-inflammatory effects of Lonicera macranthoides Hand.-Mazz based on Spectrum-effect relationship, network pharmacology and molecular docking technology"

search:
  default_top_k: 10
  max_top_k: 100
  snippet_chars: 360
  chinese_ngram_min: 1
  chinese_ngram_max: 2
  vector_candidates: 100
  rrf_k: 60
  rrf_keyword_weight: 1.5
  rrf_vector_weight: 1.0
  dual_rrf_k: 60
  dual_modern_weight: 1.0
  dual_ancient_weight: 1.0
  max_chunks_per_document: 3

embedding:
  model_id: "intfloat/multilingual-e5-small"
  runtime: "onnxruntime"
  model_filename: "model_qint8_avx512_vnni.onnx"
  dimensions: 384
  max_length: 256
  batch_size: 16
  checkpoint_every_batches: 10
  intra_op_threads: 8
  inter_op_threads: 1
  passage_prefix: "passage: "
  query_prefix: "query: "

# 可选 BGE 对照通道；索引位于独立目录，不覆盖 E5 或 rag.db。
bge:
  embedding_model_id: "BAAI/bge-m3"
  reranker_model_id: "BAAI/bge-reranker-v2-m3"
  device: "cuda:0"
  use_fp16: true
  dimensions: 1024
  embedding_batch_size: 16
  reranker_batch_size: 32
  checkpoint_every_batches: 10
  query_max_length: 512
  passage_max_length: 512
  reranker_max_length: 512
  vector_candidates: 100
  reranker_candidates: 100
  rrf_vector_weight: 1.0

# Qwen 主通道。默认分置两张 CUDA GPU；可按客户硬件修改设备编号。
qwen:
  embedding_model_id: "Qwen/Qwen3-Embedding-8B"
  reranker_model_id: "Qwen/Qwen3-Reranker-8B"
  embedding_device: "cuda:0"
  reranker_device: "cuda:1"
  dimensions: 4096
  max_length: 512
  reranker_max_length: 512
  embedding_batch_size: 2
  reranker_batch_size: 1
  checkpoint_every_batches: 10
  vector_candidates: 100
  reranker_candidates: 100
  rrf_vector_weight: 1.0
  lexical_recall_guard: true
  query_prompt: "Instruct: Retrieve evidence from Chinese and English biomedical literature about burns, scalds, wound healing, Lonicera or honeysuckle, Glycyrrhiza or licorice, active compounds, mechanisms, safety, and clinical effects.\nQuery: "

release:
  # doctor --deep 必须通过的向量通道。可选值：e5、qwen。
  required_vector_backends:
    - qwen
